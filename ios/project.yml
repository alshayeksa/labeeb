name: Labeeb
options:
  bundleIdPrefix: ai.alshaye
  developmentLanguage: ar
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Labeeb:
    type: application
    platform: iOS
    sources:
      - Labeeb
    dependencies:
      - sdk: libsqlite3.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.alshaye.labeeb
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: NO
    info:
      path: Labeeb/Info.plist
      properties:
        CFBundleDisplayName: لبيب
        CFBundleLocalizations: [ar, en]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIAppFonts:
          - Tajawal-Regular.ttf
          - Tajawal-Bold.ttf
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
        NSCameraUsageDescription: تطلب بعض المواقع استخدام الكاميرا، ولا تُفتح إلا بعد موافقتك لكل موقع.
        NSMicrophoneUsageDescription: تطلب بعض المواقع استخدام الميكروفون، ولا يُفتح إلا بعد موافقتك لكل موقع.
        NSFaceIDUsageDescription: يستخدم لبيب بصمة الوجه قبل تعبئة كلمات المرور المحفوظة أو إظهارها.
