[package]
name = "labeeb-browser"
version = "0.1.12"
edition = "2021"
license = "Apache-2.0"
[lib]
name = "labeeb_core"
crate-type = ["lib", "cdylib", "staticlib"]
[[bin]]
name = "labeeb-browser"
path = "src/main.rs"
required-features = ["desktop"]
[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:keyring"]
[build-dependencies]
tauri-build = { version = "2", optional = true , features = [] }
serde_json = "1"
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.38", features = ["bundled"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
sha2 = "0.10"
base64 = "0.22"
zip = { version = "2", default-features = false, features = ["deflate"] }
rfd = "0.15"
zeroize = "1"
tauri = { version = "2.12.5", features = ["unstable"], optional = true }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"], optional = true }
[dev-dependencies]
tempfile = "3"
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39.1"
windows = { version = "0.62", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
