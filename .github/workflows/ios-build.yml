name: iOS build and screenshots

on:
  workflow_dispatch:
    inputs:
      testflight:
        description: Sign the app and upload it to TestFlight instead of taking screenshots
        type: boolean
        default: false
  push:
    branches: [mobile-apps]
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}-${{ inputs.testflight && 'testflight' || 'screens' }}
  cancel-in-progress: true

jobs:
  ios:
    if: ${{ !inputs.testflight }}
    runs-on: xcode-27
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Build for the simulator
        run: |
          cd ios
          if ! xcodebuild -project Labeeb.xcodeproj -scheme Labeeb -configuration Debug \
              -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
              -derivedDataPath build CODE_SIGNING_ALLOWED=NO build > build.log 2>&1; then
            grep -E "error:|error :" build.log | sort -u | head -120
            exit 1
          fi
          grep -E "warning:" build.log | grep -v "ld:" | sort -u | head -40 || true

      - name: Capture screens
        run: |
          APP=ios/build/Build/Products/Debug-iphonesimulator/Labeeb.app
          UDID=$(xcrun simctl list devices available | grep -E "iPhone 1[6-9] \(" | head -1 | grep -oE '[0-9A-F-]{36}')
          echo "simulator $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          mkdir -p shots
          for shot in home page tabs confirm accounts save dialog menu settings about library reader memory assistant light english; do
            xcrun simctl terminate "$UDID" ai.alshaye.labeeb 2>/dev/null || true
            xcrun simctl launch "$UDID" ai.alshaye.labeeb -shot "$shot"
            sleep 14
            xcrun simctl io "$UDID" screenshot "shots/$shot.png"
          done
          xcrun simctl spawn "$UDID" log show --last 5m --predicate 'process == "Labeeb"' --style compact 2>/dev/null | grep -iE "fatal|crash|error" | tail -30 > shots/app.log || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-output
          path: |
            shots
            ios/build.log
          retention-days: 7

  # Signed build for TestFlight, started by hand: Actions > iOS build and screenshots > Run workflow,
  # branch mobile-apps, tick "testflight". The app identifier and its App Store profile are created at
  # Apple on the first run. Needs four repository secrets, named in the first step below.
  testflight:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.testflight }}
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4

      - name: Check signing secrets
        id: secrets
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          IOS_CERTIFICATE_PRIVATE_KEY: ${{ secrets.IOS_CERTIFICATE_PRIVATE_KEY }}
        run: |
          missing=""
          for name in APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_PRIVATE_KEY IOS_CERTIFICATE_PRIVATE_KEY; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          echo "missing=$missing" >> "$GITHUB_OUTPUT"

      - name: Generate the Xcode project
        run: |
          set -euo pipefail
          xcodebuild -version
          brew install xcodegen
          cd ios
          # App Store Connect wants each upload numbered above the last; the time of the build always is.
          sed -i '' "s/CURRENT_PROJECT_VERSION: \"1\"/CURRENT_PROJECT_VERSION: \"$(date -u +%Y%m%d%H%M)\"/" project.yml
          grep CURRENT_PROJECT_VERSION project.yml
          xcodegen generate

      - name: Without secrets, only check that the release build compiles
        if: steps.secrets.outputs.missing != ''
        run: |
          cd ios
          if ! xcodebuild -project Labeeb.xcodeproj -scheme Labeeb -configuration Release \
              -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build > build.log 2>&1; then
            grep -E "error:|error :" build.log | sort -u | head -120
            exit 1
          fi
          echo "The release build compiles. Nothing was signed or uploaded."
          echo "::error::Missing repository secrets:${{ steps.secrets.outputs.missing }}"
          exit 1

      # A key pasted into a secret often loses its line breaks or its BEGIN/END lines. This rebuilds the
      # file from the key's own characters and reports its shape, never its content.
      - name: Write the signing keys to files
        env:
          KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          CERT_KEY: ${{ secrets.IOS_CERTIFICATE_PRIVATE_KEY }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          python3 - <<'PY'
          import base64, os, re, sys
          problems = []
          def key(name, secret, kind, what):
              raw = os.environ[name]
              body = re.sub(r"-----[A-Z ]+-----", "", raw.replace("\\n", "\n"))
              body = re.sub(r"\s+", "", body)
              try:
                  der = base64.b64decode(body, validate=True)
              except Exception:
                  der = b""
              if not der or der[:1] != b"\x30":
                  problems.append("%s is not %s (%d characters, %d lines)" % (secret, what, len(raw), raw.count("\n") + 1))
              lines = [body[i:i + 64] for i in range(0, len(body), 64)]
              return len(der), "-----BEGIN %s-----\n" % kind + "\n".join(lines) + "\n-----END %s-----\n" % kind
          size, api_pem = key("KEY", "APP_STORE_CONNECT_PRIVATE_KEY", "PRIVATE KEY", "the text of a .p8 file")
          cert_size, cert_pem = key("CERT_KEY", "IOS_CERTIFICATE_PRIVATE_KEY", "RSA PRIVATE KEY", "the RSA key file")
          if not re.fullmatch(r"[A-Z0-9]{10}", os.environ["KEY_ID"].strip()):
              problems.append("APP_STORE_CONNECT_KEY_ID should be 10 letters and digits, got %d characters" % len(os.environ["KEY_ID"]))
          if not re.fullmatch(r"[0-9a-fA-F-]{36}", os.environ["ISSUER_ID"].strip()):
              problems.append("APP_STORE_CONNECT_ISSUER_ID should look like xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx, got %d characters" % len(os.environ["ISSUER_ID"]))
          for line in problems:
              print("::error::" + line)
          if problems:
              sys.exit(1)
          for variable, file, pem in (("APP_STORE_CONNECT_PRIVATE_KEY", "AuthKey.p8", api_pem),
                                      ("CERTIFICATE_PRIVATE_KEY", "certificate.key", cert_pem)):
              path = os.path.join(os.environ["RUNNER_TEMP"], file)
              with open(path, "w") as f:
                  f.write(pem)
              os.chmod(path, 0o600)
              with open(os.environ["GITHUB_ENV"], "a") as f:
                  f.write("%s=@file:%s\n" % (variable, path))
          print("Key files written: %d and %d bytes of key material." % (size, cert_size))
          PY

      - name: Fetch signing from Apple
        env:
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/ios-tools"
          "$RUNNER_TEMP/ios-tools/bin/pip" install --quiet codemagic-cli-tools==0.71.0
          export PATH="$RUNNER_TEMP/ios-tools/bin:$PATH"
          echo "$RUNNER_TEMP/ios-tools/bin" >> "$GITHUB_PATH"
          keychain initialize
          app-store-connect fetch-signing-files "ai.alshaye.labeeb" --type IOS_APP_STORE --create
          keychain add-certificates
          cd ios
          xcode-project use-profiles --project Labeeb.xcodeproj

      # An upload is refused when this key's team has no app record for the identifier, so look before
      # spending ten minutes on the build.
      - name: Check the app exists in App Store Connect
        env:
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          app-store-connect apps list --json > "$RUNNER_TEMP/apps.json" 2> "$RUNNER_TEMP/apps.err" || { tail -5 "$RUNNER_TEMP/apps.err"; exit 1; }
          python3 - <<'PY'
          import json, os, sys
          apps = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "apps.json")))
          ids = sorted(a.get("attributes", {}).get("bundleId", "?") for a in apps)
          print("Apps this key can see: %d" % len(ids))
          for i in ids:
              print("  " + i)
          if "ai.alshaye.labeeb" not in ids:
              print("::error::No app record for ai.alshaye.labeeb in the team this API key belongs to.")
              sys.exit(1)
          PY

      - name: Build the signed IPA
        run: |
          set -euo pipefail
          cd ios
          xcode-project build-ipa --project Labeeb.xcodeproj --scheme Labeeb --config Release

      - uses: actions/upload-artifact@v4
        with:
          name: Labeeb-iOS-ipa
          path: ios/build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload to TestFlight
        env:
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: app-store-connect publish --path 'ios/build/ios/ipa/*.ipa'
