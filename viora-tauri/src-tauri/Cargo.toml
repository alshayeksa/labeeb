[package]
name = "viora-tauri-prototype"
version = "0.0.1"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false

[[bin]]
name = "viora-prototype"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
rusqlite = { version = "0.41", features = ["bundled"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39.1"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell"] }

[workspace]
